<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>传染病暴发调查与接触网络</title>
  <style>
    :root { --line:#e5e7eb; --muted:#6b7280; --red:#dc2626; --red-bg:#fef2f2; --green:#16a34a; --green-bg:#f0fdf4; --amber:#b45309; --amber-bg:#fffbeb; --blue:#1d4ed8; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; color: #1f2937; background: #f9fafb; }
    main { max-width: 1080px; margin: auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.05rem; margin: 0 0 .6rem; }
    .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; margin: 1rem 0; }
    button { padding: .45rem .8rem; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: .85rem; }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }
    .badge { display: inline-block; padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; }
    .badge.following { background: #eff6ff; color: var(--blue); }
    .badge.identified { background: #f3f4f6; color: var(--muted); }
    .badge.completed { background: var(--green-bg); color: var(--green); }
    .meta { color: var(--muted); font-size: .82rem; margin: .3rem 0 .6rem; }
    .verdict { padding: .55rem .7rem; border-radius: 6px; font-size: .84rem; margin: .5rem 0; }
    .verdict.ok { background: var(--green-bg); color: var(--green); }
    .verdict.no { background: var(--red-bg); color: var(--red); }
    table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: .4rem; }
    th, td { text-align: left; padding: .28rem .35rem; border-bottom: 1px solid #f3f4f6; }
    th { color: var(--muted); font-weight: 500; }
    tr.abnormal td { background: var(--red-bg); }
    .pill { color: var(--red); font-weight: 600; }
    .rev { font-size: .75rem; color: var(--amber); }
    .inline { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-top: .5rem; }
    input { padding: .4rem .5rem; border: 1px solid var(--line); border-radius: 6px; font-size: .82rem; }
    input[name=symptoms] { width: 130px; }
    input[name=temperature] { width: 74px; }
    input[name=reason] { width: 150px; }
    #toast { position: fixed; right: 1rem; bottom: 1rem; max-width: 420px; }
    .toast-item { padding: .6rem .8rem; border-radius: 8px; margin-top: .5rem; font-size: .83rem; background: #111827; color: #fff; }
    .toast-item.err { background: var(--red); }
    .muted { color: var(--muted); font-size: .8rem; }
    details summary { cursor: pointer; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>传染病暴发调查与接触网络 · 随访解除演示</h1>
  <p class="muted">每日随访一人一天一份，独立留痕；订正保留旧值。解除观察须自最近一次异常（发热、咳嗽等）或最后接触日起连续 14 天每天有无症状记录。</p>
  <div class="toolbar">
    <button onclick="checkHealth()">检查服务状态</button>
    <button class="primary" onclick="seedDemo()">载入演示数据</button>
    <button onclick="loadAll()">刷新</button>
  </div>
  <div id="casePanel"></div>
  <div id="contacts" class="grid"></div>
</main>
<div id="toast"></div>

<script>
const HEADERS = {'Content-Type': 'application/json', 'X-User-Id': 'demo-admin', 'X-Role': 'admin'};
let state = {caseId: null, contacts: []};

function todayOffset(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}
function toast(msg, isErr) {
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item' + (isErr ? ' err' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}
async function api(method, path, body) {
  const res = await fetch(path, {method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined});
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(payload.error || (method + ' ' + path + ' failed: ' + res.status));
  return payload;
}
async function call(action, id, data) {
  try {
    await api('POST', `/api/entities/${id}/actions`, {action, data: data || {}});
    toast(action + ' 完成');
    return true;
  } catch (e) {
    toast('✗ ' + e.message, true);
    return false;
  }
}

async function checkHealth() {
  const h = await api('GET', '/health');
  toast('服务状态：' + h.status);
}

async function seedDemo() {
  const run = Date.now().toString(36);
  const caseId = 'demo-case-' + run;
  await api('POST', '/api/case', {
    id: caseId, person_id: 'P-患者', onset_date: todayOffset(-25),
    location: '演示社区', symptoms: ['fever', 'cough']
  });
  await api('POST', `/api/entities/${caseId}/actions`, {action: 'triage', data: {clinician: 'C-1'}});

  async function makeContact(key, person, exposureEnd, extra = {}) {
    const id = 'demo-' + key + '-' + run;
    await api('POST', '/api/contact', Object.assign({
      id, case_id: caseId, person_id: person,
      exposure_start: todayOffset(-30), exposure_end: exposureEnd
    }, extra));
    return id;
  }
  async function begin(id, start) {
    await api('POST', `/api/entities/${id}/actions`,
      {action: 'begin_followup', data: {followup_start: start}});
  }
  async function rec(id, date, symptoms, temperature) {
    const data = {followup_date: date, symptoms: symptoms || []};
    if (temperature != null) data.temperature = temperature;
    await api('POST', `/api/entities/${id}/actions`, {action: 'record_followup', data});
  }

  // A：观察期满 + 14天连续无症状 -> 可解除
  const a = await makeContact('a', 'P-接触者A（期满无异常）', todayOffset(-14));
  await begin(a, todayOffset(-13));
  for (let i = -13; i <= 0; i++) await rec(a, todayOffset(i), []);

  // B：观察期满但缺最近5天记录 -> 拒绝：缺少有效记录
  const b = await makeContact('b', 'P-接触者B（缺随访）', todayOffset(-15));
  await begin(b, todayOffset(-14));
  for (let i = -14; i <= -5; i++) await rec(b, todayOffset(i), []);

  // C：3天前发热，旧的连续天数作废，重新起算 -> 拒绝：观察期未满
  const c = await makeContact('c', 'P-接触者C（近期发热）', todayOffset(-20));
  await begin(c, todayOffset(-19));
  for (let i = -19; i <= -4; i++) await rec(c, todayOffset(i), []);
  await rec(c, todayOffset(-3), ['fever'], 38.6);
  for (let i = -2; i <= 0; i++) await rec(c, todayOffset(i), []);
  // 演示订正留痕：把-5天的记录改成“咳嗽”
  await api('POST', `/api/entities/${c}/actions`,
    {action: 'amend_followup', data: {followup_date: todayOffset(-5), symptoms: ['cough'], reason: '社区排查补录症状'}});

  // D：尚未开始随访；确诊后按最后接触日(exposure_end)重算观察窗
  const d = await makeContact('d', 'P-接触者D（待确诊重算）', todayOffset(-20));

  state.caseId = caseId;
  state.contacts = [a, b, c, d];
  toast('演示数据已载入');
  await loadAll();
}

async function loadAll() {
  if (!state.caseId) {
    document.getElementById('casePanel').innerHTML =
      '<div class="card muted">点击「载入演示数据」生成演示场景。</div>';
    document.getElementById('contacts').innerHTML = '';
    return;
  }
  const caseEntity = await api('GET', '/api/entities/' + state.caseId);
  document.getElementById('casePanel').innerHTML = renderCase(caseEntity);
  const box = document.getElementById('contacts');
  box.innerHTML = '';
  for (const id of state.contacts) {
    const tl = await api('GET', `/api/entities/${id}/timeline`);
    const div = document.createElement('div');
    div.innerHTML = renderContact(tl);
    box.appendChild(div);
  }
}

function renderCase(c) {
  const labels = {reported: '已报告', investigating: '调查中', confirmed: '已确诊', probable: '疑似', recovered: '已康复', closed: '已关闭'};
  return `<div class="card"><h2>病例 ${c.data.person_id} <span class="badge ${c.status}">${labels[c.status] || c.status}</span></h2>
    <div class="meta">发病日 ${c.data.onset_date} ｜ 地点 ${c.data.location} ｜ 症状 ${(c.data.symptoms||[]).join('、')}</div>
    ${c.status === 'investigating'
      ? `<button class="primary" onclick="confirmCase()">实验室确诊（lab_positive，触发接触者按最后接触日重算）</button>`
      : '<span class="muted">病例已确诊，接触者观察窗已按最后接触日重新计算。</span>'}
  </div>`;
}
async function confirmCase() {
  if (await call('lab_positive', state.caseId, {lab_id: 'L-1', result: 'positive'})) loadAll();
}

function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }

function renderContact(tl) {
  const e = tl.entity;
  const r = tl.release;
  const statusLabel = {identified: '已识别', following: '随访中', completed: '已解除'}[e.status] || e.status;
  let verdict = '';
  if (r) {
    verdict = r.eligible
      ? `<div class="verdict ok">✓ 满足解除条件：${r.observation_days} 天连续无发热、咳嗽等症状（锚点 ${r.anchor_date}，最早解除日 ${r.earliest_release_date}）</div>`
      : `<div class="verdict no">✗ ${esc(r.reason)}</div>`;
  }
  const rows = tl.followups.slice().reverse().map(f => `
    <tr class="${f.abnormal ? 'abnormal' : ''}">
      <td>${f.followup_date}</td>
      <td>${f.abnormal ? '<span class="pill">' + esc((f.symptoms||[]).join('、') || '发热') + '</span>' : (esc((f.symptoms||[]).join('、')) || '无症状')}</td>
      <td>${f.temperature == null ? '' : esc(f.temperature) + ' ℃'}</td>
    </tr>`).join('');
  const revs = tl.revisions.slice().reverse().map(v => `
    <div class="rev">订正 ${v.followup_date}：旧值「${esc((v.data.symptoms||[]).join('、')) || '无症状'}${v.data.temperature != null ? ' / ' + v.data.temperature + '℃' : ''}」→ 新值（${esc(v.reason)}，by ${esc(v.revised_by)}）</div>`).join('');

  const forms = e.status === 'identified'
    ? `<div class="inline"><button onclick="beginFollowup('${e.id}')">开始随访（按最后接触日自动算到期日）</button></div>`
    : e.status === 'following'
      ? `<div class="inline">
          <input type="date" name="fdate" value="${todayOffset(0)}">
          <input name="symptoms" placeholder="症状，逗号分隔，无症状留空">
          <input name="temperature" placeholder="体温℃">
          <button onclick="recordOne('${e.id}', this)" data-fields="fdate">提交当日随访</button>
        </div>
        <div class="inline">
          <input type="date" name="adate" value="${todayOffset(0)}">
          <input name="symptoms" placeholder="订正后症状">
          <input name="temperature" placeholder="体温℃">
          <input name="reason" placeholder="订正原因（必填）">
          <button onclick="amendOne('${e.id}', this)" data-fields="adate">订正（旧值留痕）</button>
        </div>
        <div class="inline"><button class="primary" onclick="releaseOne('${e.id}')">解除观察（连续14天无症状才放行）</button></div>`
      : '<div class="verdict ok">✓ 已解除观察</div>';

  return `<div class="card">
    <h2>${esc(e.data.person_id)} <span class="badge ${e.status}">${statusLabel}</span></h2>
    <div class="meta">最后接触日 ${r ? esc(r.last_contact_date) : esc(e.data.exposure_end || e.data.exposure_start)}
      ｜ 观察截止 ${esc(e.data.due_at || '—')}
      ${r && r.latest_abnormal_date ? ' ｜ <span style="color:var(--red)">最近异常 ' + esc(r.latest_abnormal_date) + '</span>' : ''}
    </div>
    ${verdict}
    <details ${tl.revisions.length ? 'open' : ''}><summary>随访时间线（${tl.followups.length} 份记录${tl.revisions.length ? '，' + tl.revisions.length + ' 次订正' : ''}）</summary>
      <table><thead><tr><th>日期</th><th>症状</th><th>体温</th></tr></thead><tbody>${rows || '<tr><td colspan="3" class="muted">暂无随访记录</td></tr>'}</tbody></table>
      ${revs}
    </details>
    ${forms}
  </div>`;
}

function formData(btn) {
  const card = btn.closest('.card');
  const block = btn.parentElement;
  const dateName = btn.dataset.fields;
  return {
    date: block.querySelector(`input[name=${dateName}]`).value,
    symptoms: block.querySelector('input[name=symptoms]').value,
    temperature: block.querySelector('input[name=temperature]').value,
    reason: block.querySelector('input[name=reason]') ? block.querySelector('input[name=reason]').value : ''
  };
}

async function beginFollowup(id) {
  if (await call('begin_followup', id, {followup_start: todayOffset(0)})) loadAll();
}
async function recordOne(id, btn) {
  const f = formData(btn);
  const data = {followup_date: f.date, symptoms: f.symptoms ? f.symptoms.split(/[,，、;；\s]+/).filter(Boolean) : []};
  if (f.temperature) data.temperature = Number(f.temperature);
  if (await call('record_followup', id, data)) loadAll();
}
async function amendOne(id, btn) {
  const f = formData(btn);
  if (!f.reason) { toast('✗ 订正必须填写原因（旧值仍会留痕）', true); return; }
  const data = {followup_date: f.date, symptoms: f.symptoms ? f.symptoms.split(/[,，、;；\s]+/).filter(Boolean) : [], reason: f.reason};
  if (f.temperature) data.temperature = Number(f.temperature);
  if (await call('amend_followup', id, data)) loadAll();
}
async function releaseOne(id) {
  if (await call('complete_followup', id, {outcome: '连续14天无发热、咳嗽等症状，解除观察'})) loadAll();
}

loadAll();
</script>
</body>
</html>
